<!doctype html>
<!-- Template for the 1200x630 social image. shots.mjs renders it to ../og.png. -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Geist:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; color: #12141a; font: 24px/1.4 "Geist", system-ui, sans-serif;
    background: #eef0f4 radial-gradient(#cdd2dc 1px, transparent 1.4px) 0 0 / 22px 22px; }
  .text { position: absolute; left: 60px; top: 56px; width: 510px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 26px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, oklch(0.55 0.2 258), oklch(0.65 0.15 220)); }
  h1 { font: 700 58px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -0.035em; margin: 64px 0 28px; }
  p { margin: 0; color: #3a3f4c; }
  img { position: absolute; display: block; background: #fff; border: 1px solid #d8dce4; border-radius: 14px; box-shadow: 0 2px 4px rgb(18 20 26 / .08), 0 22px 60px rgb(18 20 26 / .18); }
  .screen { left: 600px; top: 70px; width: 760px; }
  .thread { left: 800px; top: 236px; width: 340px; }
</style>
<div class="text">
  <div class="brand"><span class="logo"></span>Clickthrough</div>
  <h1>Click the button that's wrong. Your coding agent fixes it.</h1>
  <p>An open-source review page for product flows. Works with any coding agent.</p>
</div>
<img class="screen" src="../media/versions.webp" alt="">
<img class="thread" src="../media/evidence.webp" alt="">
