<!doctype html>
<!-- Template for the 1200x630 social image. og.mjs renders it to ../og.png. -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; color: #18181b; font: 24px/1.4 "Geist", system-ui, sans-serif;
    background: #f5f5f7 radial-gradient(#d4d4dc 1px, transparent 1.4px) 0 0 / 22px 22px; }
  .text { position: absolute; left: 64px; top: 70px; width: 520px; }
  .sel { position: relative; display: inline-block; outline: 2px solid #7b4dff; padding: .22em .36em; }
  .sel::before { content: attr(data-k); position: absolute; left: -2px; bottom: calc(100% + 2px); background: #7b4dff; color: #fff; font: 500 14px/1 "Geist Mono", monospace; letter-spacing: 0; padding: 5px 7px; white-space: nowrap; }
  .sel i { position: absolute; width: 10px; height: 10px; background: #fff; border: 2px solid #7b4dff; }
  .sel i:nth-of-type(1) { left: -7px; top: -7px; } .sel i:nth-of-type(2) { right: -7px; top: -7px; }
  .sel i:nth-of-type(3) { left: -7px; bottom: -7px; } .sel i:nth-of-type(4) { right: -7px; bottom: -7px; }
  .brand { font-weight: 600; font-size: 30px; letter-spacing: -0.035em; line-height: 1; }
  h1 { font: 600 58px/1.03 "Geist", sans-serif; letter-spacing: -0.045em; margin: 78px 0 0; }
  h1 .sel { padding: .14em .2em; margin-left: -.2em; }
  p { margin: 30px 0 0; color: #3f3f46; }
  img { position: absolute; display: block; background: #fff; border: 1px solid #dcdce2; border-radius: 14px; box-shadow: 0 2px 4px rgb(24 24 27 / .08), 0 22px 60px rgb(24 24 27 / .18); }
  .screen { left: 620px; top: 70px; width: 760px; }
  .thread { left: 820px; top: 236px; width: 340px; }
</style>
<div class="text">
  <div class="brand"><span class="sel" data-k="Heading"><i></i><i></i><i></i><i></i>clickthrough</span></div>
  <h1><span class="sel" data-k="Heading"><i></i><i></i><i></i><i></i>Click what's wrong. Your agent fixes it.</span></h1>
  <p>An open-source review page for product flows. Works with any coding agent.</p>
</div>
<img class="screen" src="../media/versions.webp" alt="">
<img class="thread" src="../media/evidence.webp" alt="">
